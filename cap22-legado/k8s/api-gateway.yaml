# api-gateway (capítulo 20).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      # Capítulo 21: avisa o Prometheus que este Pod tem /metrics.
      annotations:
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/name: api-gateway
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api-gateway
          image: eventos/api-gateway
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: eventos-config
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          # Ao apagar um Pod, o Kubernetes envia o SIGTERM e, ao mesmo tempo, tira o
          # Pod do Service. Por um instante, ainda chegam conexões novas. Os 3
          # segundos de espera antes do SIGTERM dão tempo para todos pararem de
          # mandar tráfego para cá (capítulo 19).
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "3"]
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # O /health do gateway responde 503 quando um serviço atrás dele cai.
          # Nem por isso o gateway deve sair do ar: ele ainda atende as outras
          # rotas. Por isso a prontidão dele também é o /health/live.
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  # A porta de entrada: um IP acessível de fora do cluster.
  # No Docker Desktop, ele aparece em localhost:9000.
  type: LoadBalancer
  # Entrega ao gateway o endereço real do cliente (o limite de login do
  # capítulo 16 conta por endereço). Sem isto, o Kubernetes troca a origem
  # pelo endereço do nó, e todos os clientes dividem a mesma cota.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 9000
      targetPort: http
