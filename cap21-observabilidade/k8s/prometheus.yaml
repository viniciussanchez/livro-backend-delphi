# Prometheus para a plataforma (capítulo 21).
# Ele descobre sozinho os Pods do namespace "eventos" que tenham a anotação
# prometheus.io/scrape: "true" e lê o /metrics de cada um a cada 5 segundos.
#
#   kubectl -n eventos port-forward svc/prometheus 9090:9090
#   http://localhost:9090
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
# Para descobrir os Pods, o Prometheus pergunta à API do Kubernetes.
# Este papel deixa ele só listar e acompanhar Pods, e só neste namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: eventos
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [eventos]
        relabel_configs:
          # Só os Pods que pediram para ser lidos.
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # Só a porta chamada "http" (a dos nossos serviços).
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: http
          # Rótulos legíveis: o nome do serviço e o do Pod.
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1d
          ports:
            - name: web
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        # Laboratório: os dados somem com o Pod. Em produção, use um disco.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
