# ticket-api (capítulo 20): três cópias vendendo os mesmos ingressos.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-api
  labels:
    app.kubernetes.io/name: ticket-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ticket-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ticket-api
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      # Antes do serviço, um contêiner que só espera o banco aceitar conexões.
      # O Kubernetes não tem "depends_on": cada peça espera o que precisa.
      initContainers:
        - name: wait-for-postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432 -U eventos; do echo "esperando o banco"; sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      containers:
        - name: ticket-api
          image: eventos/ticket-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9003
          envFrom:
            - configMapRef:
                name: eventos-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eventos-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: eventos-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-api
  labels:
    app.kubernetes.io/name: ticket-api
spec:
  selector:
    app.kubernetes.io/name: ticket-api
  ports:
    - name: http
      port: 9003
      targetPort: http
