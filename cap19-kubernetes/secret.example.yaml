# MODELO (fora da pasta k8s de propósito). Não aplique este arquivo com os valores daqui e nunca coloque
# os valores reais no Git. Crie o Secret a partir do seu .env:
#
#   kubectl create secret generic eventos-secrets -n eventos --from-env-file=.env
#
# O .env precisa ter, pelo menos, DB_PASSWORD e JWT_SECRET.
apiVersion: v1
kind: Secret
metadata:
  name: eventos-secrets
  namespace: eventos
type: Opaque
stringData:
  DB_PASSWORD: troque-esta-senha-do-banco
  JWT_SECRET: troque-por-uma-chave-com-pelo-menos-32-caracteres
