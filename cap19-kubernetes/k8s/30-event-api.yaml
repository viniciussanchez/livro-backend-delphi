# A event-api no Kubernetes (capítulo 19).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-api
  namespace: eventos
  labels:
    app.kubernetes.io/name: event-api
    app.kubernetes.io/part-of: eventos
spec:
  # Quantas cópias queremos. O Kubernetes cuida de manter esse número.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: event-api
  # Atualização em etapas: sobe um Pod novo, espera ficar pronto,
  # derruba um velho, e assim por diante. Nunca fica sem nenhum.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: event-api
        app.kubernetes.io/part-of: eventos
    spec:
      # Tempo entre o SIGTERM e o SIGKILL (capítulo 17).
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: event-api
          # A imagem do capítulo 18, construída localmente. Com IfNotPresent,
          # o Kubernetes usa a que já está na máquina, sem ir à internet.
          image: eventos/event-api:cap19
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9001
          # As mesmas variáveis do capítulo 14: o código não muda nada.
          envFrom:
            - configMapRef:
                name: eventos-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eventos-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: eventos-secrets
                  key: JWT_SECRET
          # Quanto o Pod pede (para o agendador escolher um nó) e quanto,
          # no máximo, pode usar (passou da memória, é reiniciado).
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          # Enquanto sobe (migrações incluídas), só esta sonda vale.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # Está vivo? Se falhar 3 vezes seguidas, o contêiner é reiniciado.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Pode receber tráfego? Se falhar, sai do Service, mas não reinicia.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: event-api
  namespace: eventos
spec:
  selector:
    app.kubernetes.io/name: event-api
  ports:
    - name: http
      port: 9001
      targetPort: http
